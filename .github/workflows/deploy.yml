# Deploy: runs when main changes, which only happens by merging a release PR
# (release/<tag> -> main, see release.yml). It deploys exactly the web build that
# passed the release pipeline: the web zip attached to that tag's draft release.
#   1. find the merged tag (second parent of the merge commit)
#   2. push that web build to the `web-deploy` branch, under public/; DigitalOcean
#      App Platform (.do/app.yaml) watches that branch and redeploys
#   3. publish the draft release (it becomes the "Latest" release with the downloads)
# Optional GitHub Pages: repo variable DEPLOY_PAGES=true and Pages source "GitHub Actions".
# Manual run: redeploy any released tag (Actions -> deploy -> Run workflow).
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to deploy (e.g. v1.2.3)"
        required: true

concurrency:
  group: web-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Find the release tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-}"
          if [ -z "$TAG" ]; then
            # A merged release PR: the merge commit's second parent is the tagged commit.
            for c in HEAD^2 HEAD; do
              TAG=$(git tag --points-at "$c" --list 'v*' 2> /dev/null | sort -V | tail -n1 || true)
              [ -n "$TAG" ] && break
            done
          fi
          if [ -z "$TAG" ]; then
            echo "::error::No release tag found for $GITHUB_SHA. main should only receive release PRs (release/<tag>)."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Deploying $TAG" >> "$GITHUB_STEP_SUMMARY"

      - name: Download the tested web build
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p "SpellTower-${TAG}-web.zip" -D "$RUNNER_TEMP"
          mkdir -p site/public
          unzip -q "$RUNNER_TEMP/SpellTower-${TAG}-web.zip" -d site/public
          test -f site/public/index.html && test -f site/public/index.wasm && test -f site/public/index.pck

      - name: Publish to the web-deploy branch (DigitalOcean)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          cd site
          printf '%s\n' \
            "# SpellTower web build $TAG" \
            "" \
            "Generated by .github/workflows/deploy.yml from release $TAG." \
            "Served by DigitalOcean App Platform (.do/app.yaml). Don't edit: it's replaced on every deploy." > README.md
          git init -q -b web-deploy
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Web build $TAG"
          git push -fq "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" web-deploy
          echo "Pushed $TAG to the \`web-deploy\` branch." >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          if [ "$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json isDraft -q .isDraft)" = "true" ]; then
            gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --draft=false --latest
            echo "Published release $TAG." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Prepare Pages artifact
        if: vars.DEPLOY_PAGES == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/public

  deploy-pages:
    needs: deploy
    if: vars.DEPLOY_PAGES == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
