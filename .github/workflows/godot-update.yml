# Dependabot-style updates for Godot (Dependabot has no Godot ecosystem).
# Weekly, compares .godot-version with godotengine/godot-builds releases:
#   - newer patch in the same series (4.7.2 -> 4.7.3): opens a PR bumping .godot-version
#   - newer minor/major (4.8, 5.0): opens an issue, since those need an editor upgrade
#     and a project.godot change, not just a pin bump.
# PRs target develop (main is protected and only changes through release PRs).
# Needs: Settings -> Actions -> General -> "Allow GitHub Actions to create and approve pull requests".
name: godot-update

on:
  schedule:
    - cron: "23 5 * * 1"   # Mondays 05:23 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop

      - name: Check for newer Godot releases
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: develop
        run: |
          set -euo pipefail
          newer() { [ "$1" != "$2" ] && [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | tail -n1)" = "$1" ]; }

          CURRENT=$(tr -d '[:space:]' < .godot-version)   # 4.7.2-stable
          CUR=${CURRENT%-*}                                # 4.7.2
          SERIES=$(echo "$CUR" | cut -d. -f1,2)            # 4.7

          # Stable tags only ("4.7-stable", "4.7.2-stable"), without the suffix.
          STABLE=$(gh release list -R godotengine/godot-builds --limit 200 --json tagName -q '.[].tagName' \
            | grep -E '^[0-9]+\.[0-9]+(\.[0-9]+)?-stable$' | sed 's/-stable$//' | sort -V)
          LATEST_PATCH=$(echo "$STABLE" | awk -F. -v s="$SERIES" '$1"."$2==s' | tail -n1)
          LATEST_ANY=$(echo "$STABLE" | tail -n1)
          echo "Pinned: $CUR  latest $SERIES.x: ${LATEST_PATCH:-none}  latest overall: $LATEST_ANY"

          if [ -n "$LATEST_PATCH" ] && newer "$LATEST_PATCH" "$CUR"; then
            NEW="$LATEST_PATCH-stable"
            BRANCH="godot/$LATEST_PATCH"
            if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
              echo "Branch $BRANCH already exists; skipping PR."
            else
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git switch -c "$BRANCH"
              echo "$NEW" > .godot-version
              git commit -am "Bump Godot from $CURRENT to $NEW"
              git push origin "$BRANCH"
              gh pr create --base "$BASE_BRANCH" --head "$BRANCH" \
                --title "Bump Godot from $CUR to $LATEST_PATCH" \
                --body "Patch release of Godot $SERIES: https://github.com/godotengine/godot-builds/releases/tag/$NEW

          Update your local editor to $LATEST_PATCH too, so CI and local exports match."
              # Pushes made with GITHUB_TOKEN don't trigger push/pull_request runs; start the build explicitly.
              gh workflow run build.yml --ref "$BRANCH"
            fi
          fi

          LATEST_SERIES=$(echo "$LATEST_ANY" | cut -d. -f1,2)
          if newer "$LATEST_SERIES" "$SERIES"; then
            TITLE="Godot $LATEST_SERIES is available"
            if [ -z "$(gh issue list --state all --search "\"$TITLE\" in:title" --json number -q '.[].number')" ]; then
              gh issue create --title "$TITLE" \
                --body "Godot $LATEST_ANY is out (pinned: $CUR). Upgrading means opening the project in the new editor, updating \`config/features\` in project.godot, and bumping .godot-version.

          https://github.com/godotengine/godot-builds/releases/tag/$LATEST_ANY-stable" \
                || echo "::warning::Could not open issue (are issues enabled?)"
            else
              echo "Issue '$TITLE' already exists."
            fi
          fi
