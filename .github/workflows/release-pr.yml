# Publishing a GitHub Release opens a "Release <tag>" PR from develop to main.
# Merging that PR updates main, and build.yml then tests, exports and deploys it
# to DigitalOcean. (main is protected: changes only arrive through PRs.)
#
# The PR's head is develop's latest commit, which build.yml already tested on
# push, so the required checks are there even though a PR opened with the
# workflow token doesn't start a new run.
# Needs: Settings -> Actions -> General -> "Allow GitHub Actions to create and approve pull requests".
name: release-pr

on:
  release:
    types: [published]

permissions:
  contents: read
  pull-requests: write

env:
  BASE: main
  HEAD_BRANCH: develop

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Open the develop -> main release PR
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
        run: |
          set -euo pipefail
          R="$GITHUB_REPOSITORY"

          OPEN=$(gh pr list -R "$R" --base "$BASE" --head "$HEAD_BRANCH" --state open --json number -q '.[0].number // empty')
          if [ -n "$OPEN" ]; then
            gh pr comment "$OPEN" -R "$R" --body "Release [$TAG]($RELEASE_URL) was published. This PR now carries it too."
            echo "Release PR #$OPEN is already open; added a comment for $TAG." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          AHEAD=$(gh api "repos/$R/compare/$BASE...$HEAD_BRANCH" -q .ahead_by)
          if [ "$AHEAD" = "0" ]; then
            echo "::notice::$HEAD_BRANCH has no commits that aren't on $BASE; no release PR needed."
            exit 0
          fi

          URL=$(gh pr create -R "$R" --base "$BASE" --head "$HEAD_BRANCH" \
            --title "Release $TAG" \
            --body "Release [$TAG]($RELEASE_URL): $AHEAD commit(s) from \`$HEAD_BRANCH\`.

          Merging this PR deploys the game to DigitalOcean (build.yml -> \`web-deploy\` branch).")
          echo "Opened $URL" >> "$GITHUB_STEP_SUMMARY"
