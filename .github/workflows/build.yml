# Tests + exports on every push / PR:
#   - unit tests (GdUnit4, tests/unit/) and scripted smoke playthroughs
#   - web export, portable Windows .exe, Linux binary and AppImage
#   - launch checks: each desktop build must start and quit cleanly
# Also called by release.yml (workflow_call) to build and test a release.
# Deploys when main changes (a merged release PR, see release.yml):
#   - DigitalOcean App Platform: the export is force-pushed to the `web-deploy`
#     branch, which the App Platform static site (.do/app.yaml) auto-deploys.
#   - Optional GitHub Pages: Settings -> Pages -> Source: "GitHub Actions",
#     and repo variable DEPLOY_PAGES=true.
name: build

on:
  push:
    branches-ignore: [web-deploy]   # generated branch: no project to build
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Publish this build to DigitalOcean (web-deploy branch)"
        type: boolean
        default: false
  workflow_call:

env:
  APPIMAGETOOL_VERSION: "1.9.1"

jobs:
  test-and-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The Godot version is pinned in .godot-version (e.g. "4.7.2-stable") so
      # workflows/godot-update.yml can bump it without editing a workflow file.
      - name: Read Godot version
        run: |
          set -euo pipefail
          PIN=$(tr -d '[:space:]' < .godot-version)
          echo "GODOT_VERSION=${PIN%-*}" >> "$GITHUB_ENV"
          echo "GODOT_RELEASE=${PIN##*-}" >> "$GITHUB_ENV"

      - name: Cache Godot
        uses: actions/cache@v6
        with:
          path: ~/godot
          key: godot-${{ hashFiles('.godot-version') }}

      - name: Install Godot and export templates
        run: |
          set -euo pipefail
          V="${GODOT_VERSION}-${GODOT_RELEASE}"
          BASE="https://github.com/godotengine/godot-builds/releases/download/${V}"
          mkdir -p ~/godot && cd ~/godot
          if [ ! -x godot ]; then
            curl -fsSL -o godot.zip "${BASE}/Godot_v${V}_linux.x86_64.zip"
            unzip -q godot.zip && mv "Godot_v${V}_linux.x86_64" godot && rm godot.zip
            curl -fsSL -o templates.tpz "${BASE}/Godot_v${V}_export_templates.tpz"
            unzip -q templates.tpz && rm templates.tpz
          fi
          T="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}"
          mkdir -p "$T" && cp -r ~/godot/templates/. "$T"/
          echo "$HOME/godot" >> "$GITHUB_PATH"

      - name: Import assets
        run: godot --headless --path . --import

      # GdUnit4 exit codes: 0 ok, 100 failures, 101 orphan nodes (also a failure here).
      - name: Unit tests (GdUnit4)
        run: |
          godot --headless --path . -s -d res://addons/gdUnit4/bin/GdUnitCmdTool.gd \
            -a res://tests/unit --ignoreHeadlessMode -rd reports

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: reports
          if-no-files-found: ignore

      - name: Smoke tests
        run: |
          set -e
          for args in "en" "nb" "en 0"; do
            echo "::group::smoke $args"
            godot --headless --path . --fixed-fps 60 --script res://tests/smoke_game.gd -- $args
            echo "::endgroup::"
          done

      - name: Export web
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html
          test -f build/web/index.pck

      # The local test server is stdlib-only; check it still works on the
      # latest patched Python 3 against the fresh export.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
          check-latest: true

      - name: Test web server
        run: |
          set -euo pipefail
          python tools/serve_web.py --port 8060 &
          SERVER=$!
          for _ in $(seq 1 20); do curl -fsS -o /dev/null http://127.0.0.1:8060/ && break; sleep 0.5; done
          H="$RUNNER_TEMP/headers.txt"
          curl -fsSI http://127.0.0.1:8060/index.wasm | tee "$H"
          grep -qi '^content-type: application/wasm' "$H"
          grep -qi '^cache-control: no-store' "$H"
          grep -qi '^cross-origin-opener-policy: same-origin' "$H"
          grep -qi '^cross-origin-embedder-policy: require-corp' "$H"
          kill "$SERVER"

      - uses: actions/upload-artifact@v7
        with:
          name: spelltower-web
          path: build/web

      # Single-file desktop builds: the game data is embedded (embed_pck).
      - name: Export Windows and Linux
        run: |
          set -euo pipefail
          mkdir -p build/windows build/linux
          godot --headless --path . --export-release "Windows Desktop" build/windows/SpellTower.exe
          godot --headless --path . --export-release "Linux" build/linux/SpellTower.x86_64
          test ! -e build/windows/SpellTower.pck && test ! -e build/linux/SpellTower.pck

      - name: Launch check (Linux binary)
        run: |
          set -euo pipefail
          chmod +x build/linux/SpellTower.x86_64
          LOG="$RUNNER_TEMP/linux.log"
          build/linux/SpellTower.x86_64 --headless --quit-after 300 2>&1 | tee "$LOG"
          ! grep -E "SCRIPT ERROR|^ERROR" "$LOG"

      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"   # runners have no FUSE
          ARCH: x86_64
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq librsvg2-bin > /dev/null
          curl -fsSL -o "$RUNNER_TEMP/appimagetool" \
            "https://github.com/AppImage/appimagetool/releases/download/${APPIMAGETOOL_VERSION}/appimagetool-x86_64.AppImage"
          chmod +x "$RUNNER_TEMP/appimagetool"
          A="$RUNNER_TEMP/SpellTower.AppDir"
          mkdir -p "$A/usr/bin"
          cp build/linux/SpellTower.x86_64 "$A/usr/bin/"
          rsvg-convert -w 256 -h 256 icon.svg -o "$A/spelltower.png"
          printf '%s\n' '#!/bin/sh' 'HERE="$(dirname "$(readlink -f "$0")")"' 'exec "$HERE/usr/bin/SpellTower.x86_64" "$@"' > "$A/AppRun"
          chmod +x "$A/AppRun"
          printf '%s\n' '[Desktop Entry]' 'Type=Application' 'Name=SpellTower' 'Comment=Spelling game' \
            'Exec=SpellTower.x86_64' 'Icon=spelltower' 'Categories=Game;Education;' 'Terminal=false' > "$A/spelltower.desktop"
          mkdir -p build/appimage
          "$RUNNER_TEMP/appimagetool" "$A" build/appimage/SpellTower-x86_64.AppImage

      - name: Launch check (AppImage)
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/appimage.log"
          build/appimage/SpellTower-x86_64.AppImage --headless --quit-after 300 2>&1 | tee "$LOG"
          ! grep -E "SCRIPT ERROR|^ERROR" "$LOG"

      - uses: actions/upload-artifact@v7
        with:
          name: spelltower-windows
          path: build/windows/SpellTower.exe

      - uses: actions/upload-artifact@v7
        with:
          name: spelltower-linux
          path: build/linux/SpellTower.x86_64

      - uses: actions/upload-artifact@v7
        with:
          name: spelltower-appimage
          path: build/appimage/SpellTower-x86_64.AppImage

      - name: Prepare Pages artifact
        if: vars.DEPLOY_PAGES == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/web

  # The .exe must start and quit cleanly on a real Windows machine.
  launch-windows:
    needs: test-and-export
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: spelltower-windows
      - name: Launch check (Windows .exe)
        shell: pwsh
        run: |
          # A GUI .exe doesn't block the shell, so wait for it explicitly.
          $p = Start-Process -FilePath .\SpellTower.exe -ArgumentList '--headless', '--quit-after', '300' `
            -Wait -PassThru -NoNewWindow -RedirectStandardOutput out.log -RedirectStandardError err.log
          Get-Content out.log, err.log
          if ($p.ExitCode -ne 0) { throw "SpellTower.exe exited with $($p.ExitCode)" }
          if (Select-String -Path out.log, err.log -Pattern 'SCRIPT ERROR|^ERROR' -Quiet) { throw "errors while starting" }

  deploy-pages:
    needs: test-and-export
    if: vars.DEPLOY_PAGES == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # The App Platform static site watches `web-deploy` (deploy_on_push). The
  # branch is rebuilt as a single commit each time, so it never grows.
  deploy-digitalocean:
    needs: [test-and-export, launch-windows]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.deploy)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: web-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: spelltower-web
          path: site/public

      - name: Publish to the web-deploy branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -f site/public/index.html && test -f site/public/index.wasm && test -f site/public/index.pck
          cd site
          printf '%s\n' \
            "# SpellTower web build" \
            "" \
            "Generated by .github/workflows/build.yml from ${GITHUB_REPOSITORY}@${GITHUB_SHA} (${GITHUB_REF_NAME})." \
            "Served by DigitalOcean App Platform (.do/app.yaml). Don't edit: it's replaced on every deploy." > README.md
          git init -q -b web-deploy
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Web build ${GITHUB_SHA::7} (${GITHUB_REF_NAME})"
          git push -fq "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" web-deploy
          echo "Deployed \`${GITHUB_SHA::7}\` from \`${GITHUB_REF_NAME}\` to the \`web-deploy\` branch." >> "$GITHUB_STEP_SUMMARY"
