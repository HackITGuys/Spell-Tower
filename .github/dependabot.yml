# Dependabot keeps the GitHub Actions used by the workflows patched.
# Godot itself is not a Dependabot ecosystem; see workflows/godot-update.yml.
# tools/serve_web.py uses only the Python standard library, so there are no
# pip packages to track; CI tests it on the latest Python 3 instead.
# PRs target develop: main is protected and only changes through release PRs.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
  - package-ecosystem: npm # Playwright for the browser function tests
    directory: /tests/e2e
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      e2e:
        patterns: ["*"]
    commit-message:
      prefix: test
