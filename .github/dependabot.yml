# Dependabot keeps the GitHub Actions used by the workflows patched.
# Godot itself is not a Dependabot ecosystem; see workflows/godot-update.yml.
# tools/serve_web.py uses only the Python standard library, so there are no
# pip packages to track; CI tests it on the latest Python 3 instead.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
